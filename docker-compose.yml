services:
  redis:
    # Redis Stack = Redis server + RedisInsight web UI (port 8001 inside the container).
    image: redis/redis-stack:latest
    environment:
      # appendonly = write every change to disk, so queued tasks and job results survive a restart.
      # volatile-ttl = when memory is full, evict only keys with a TTL (job results), soonest-to-expire first;
      # the Celery queue keys have no TTL, so queued tasks are never evicted.
      REDIS_ARGS: "--appendonly yes --maxmemory ${REDIS_MAXMEMORY:-256mb} --maxmemory-policy volatile-ttl"
    ports:
      - "${REDIS_UI_PORT:-18080}:8001"               # RedisInsight UI; Redis itself (6379) stays internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - redisdata:/data

  api:
    build: .
    environment: &env
      REDIS_URL: redis://redis:6379/0
      TASK_DEADLINE_SECONDS: "20"
    ports:
      - "${APP_PORTS:-18000}:8000"              # each API container gets one host port from this range
    deploy:
      replicas: ${APP_REPLICAS:-1}                    # number of API containers
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["sh", "-c", "exec celery -A app.worker worker --pool=threads --concurrency=$${WORKER_CONCURRENCY} --loglevel=INFO"]
    environment:
      <<: *env
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}   # parallel domains per worker container
    deploy:
      replicas: ${WORKER_REPLICAS:-1}                 # number of worker containers
    depends_on:
      redis:
        condition: service_healthy
    stop_grace_period: 30s

volumes:
  redisdata:
