[project]
name = "domain-service"
version = "1.0.0"
description = "Asynchronous domain processing service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.4,<6",
    "dnspython>=2.6,<3",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "redis>=5",
    "uvicorn>=0.29,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "fakeredis>=2.23",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
