<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 640" width="1500" height="640" font-family="Virgil, 'Segoe Print', 'Comic Sans MS', cursive"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="he6741d9" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#6741d9" stroke-width="2"/></marker><marker id="hs6741d9" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#6741d9" stroke-width="2"/></marker><marker id="hee8590c" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#e8590c" stroke-width="2"/></marker><marker id="hse8590c" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#e8590c" stroke-width="2"/></marker><marker id="he495057" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#495057" stroke-width="2"/></marker><marker id="hs495057" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#495057" stroke-width="2"/></marker><marker id="he2f9e44" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#2f9e44" stroke-width="2"/></marker><marker id="hs2f9e44" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#2f9e44" stroke-width="2"/></marker></defs><text x="750" y="44.0" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="bold">Inside a worker: how one domain is processed</text><rect x="30" y="120" width="220" height="330" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/><text x="140.0" y="148.0" font-size="18" fill="#2f9e44" text-anchor="middle" font-weight="bold">Celery worker</text><text x="140.0" y="174.0" font-size="14" fill="#343a40" text-anchor="middle">one container</text><text x="140.0" y="191.5" font-size="14" fill="#343a40" text-anchor="middle">= one process</text><text x="140.0" y="209.0" font-size="14" fill="#343a40" text-anchor="middle"></text><text x="140.0" y="226.5" font-size="14" fill="#343a40" text-anchor="middle">thread pool of</text><text x="140.0" y="244.0" font-size="14" fill="#343a40" text-anchor="middle">WORKER_CONCURRENCY</text><text x="140.0" y="261.5" font-size="14" fill="#343a40" text-anchor="middle">threads</text><text x="140.0" y="279.0" font-size="14" fill="#343a40" text-anchor="middle"></text><text x="140.0" y="296.5" font-size="14" fill="#343a40" text-anchor="middle">each thread runs</text><text x="140.0" y="314.0" font-size="14" fill="#343a40" text-anchor="middle">1 domain at a time</text><rect x="300" y="120" width="240" height="330" rx="14" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><text x="420.0" y="148.0" font-size="18" fill="#2f9e44" text-anchor="middle" font-weight="bold">process_domain_task</text><text x="420.0" y="174.0" font-size="14" fill="#343a40" text-anchor="middle">1. HSETNX status</text><text x="420.0" y="191.5" font-size="14" fill="#343a40" text-anchor="middle">   = in_progress</text><text x="420.0" y="209.0" font-size="14" fill="#343a40" text-anchor="middle"></text><text x="420.0" y="226.5" font-size="14" fill="#343a40" text-anchor="middle">2. asyncio.run(probe)</text><text x="420.0" y="244.0" font-size="14" fill="#343a40" text-anchor="middle">   with 20 s deadline</text><text x="420.0" y="261.5" font-size="14" fill="#343a40" text-anchor="middle"></text><text x="420.0" y="279.0" font-size="14" fill="#343a40" text-anchor="middle">3. HSET result</text><text x="420.0" y="296.5" font-size="14" fill="#343a40" text-anchor="middle">   (idempotent)</text><rect x="590" y="120" width="200" height="140" rx="14" fill="#f8f9fa" stroke="#495057" stroke-width="2"/><text x="690.0" y="148.0" font-size="18" fill="#495057" text-anchor="middle" font-weight="bold">Validate name</text><text x="690.0" y="174.0" font-size="14" fill="#343a40" text-anchor="middle">no URL / IP / port</text><text x="690.0" y="191.5" font-size="14" fill="#343a40" text-anchor="middle">IDNA normalize</text><text x="690.0" y="209.0" font-size="14" fill="#343a40" text-anchor="middle">invalid → failed</text><rect x="840" y="120" width="300" height="200" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><text x="990.0" y="148.0" font-size="18" fill="#6741d9" text-anchor="middle" font-weight="bold">DNS (asyncio.gather)</text><text x="990.0" y="174.0" font-size="14" fill="#343a40" text-anchor="middle">A  AAAA  TXT</text><text x="990.0" y="191.5" font-size="14" fill="#343a40" text-anchor="middle">CNAME  MX  NS</text><text x="990.0" y="209.0" font-size="14" fill="#343a40" text-anchor="middle">6 queries in parallel</text><text x="990.0" y="226.5" font-size="14" fill="#343a40" text-anchor="middle">4 s lifetime</text><text x="990.0" y="244.0" font-size="14" fill="#343a40" text-anchor="middle">no A/AAAA → failed</text><rect x="1190" y="120" width="280" height="200" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><text x="1330.0" y="148.0" font-size="18" fill="#6741d9" text-anchor="middle" font-weight="bold">HTTP probe (httpx)</text><text x="1330.0" y="174.0" font-size="14" fill="#343a40" text-anchor="middle">HTTPS, fallback HTTP</text><text x="1330.0" y="191.5" font-size="14" fill="#343a40" text-anchor="middle">5 s timeout</text><text x="1330.0" y="209.0" font-size="14" fill="#343a40" text-anchor="middle">status, title, time_ms</text><text x="1330.0" y="226.5" font-size="14" fill="#343a40" text-anchor="middle">no redirects, 64 KB cap</text><text x="1330.0" y="244.0" font-size="14" fill="#343a40" text-anchor="middle">down → http_error</text><rect x="840" y="370" width="300" height="120" rx="14" fill="#fff4e6" stroke="#e8590c" stroke-width="2"/><text x="990.0" y="398.0" font-size="18" fill="#e8590c" text-anchor="middle" font-weight="bold">Public IP check</text><text x="990.0" y="424.0" font-size="14" fill="#343a40" text-anchor="middle">private / loopback IP</text><text x="990.0" y="441.5" font-size="14" fill="#343a40" text-anchor="middle">→ failed (SSRF guard)</text><rect x="1190" y="370" width="280" height="120" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2"/><text x="1330.0" y="398.0" font-size="18" fill="#e03131" text-anchor="middle" font-weight="bold">Result → Redis</text><text x="1330.0" y="424.0" font-size="14" fill="#343a40" text-anchor="middle">COMPLETED / FAILED</text><text x="1330.0" y="441.5" font-size="14" fill="#343a40" text-anchor="middle">visible in GET</text><text x="1330.0" y="459.0" font-size="14" fill="#343a40" text-anchor="middle">immediately</text><line x1="252" y1="285" x2="298" y2="285" stroke="#2f9e44" stroke-width="2" marker-end="url(#he2f9e44)"/><line x1="542" y1="190" x2="588" y2="190" stroke="#495057" stroke-width="2" marker-end="url(#he495057)"/><line x1="792" y1="190" x2="838" y2="210" stroke="#6741d9" stroke-width="2" marker-end="url(#he6741d9)"/><line x1="990" y1="322" x2="990" y2="368" stroke="#e8590c" stroke-width="2" marker-end="url(#hee8590c)"/><line x1="1142" y1="430" x2="1190" y2="260" stroke="#e8590c" stroke-width="2" marker-end="url(#hee8590c)"/><line x1="1330" y1="322" x2="1330" y2="368" stroke="#6741d9" stroke-width="2" marker-end="url(#he6741d9)"/><text x="40" y="538.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="bold">Timeouts (nothing waits forever)</text><text x="40" y="562.0" font-size="14" fill="#1e1e1e" text-anchor="start">DNS server attempt 2 s  •  DNS total 4 s (hard stop 5 s)  •  HTTP 5 s per phase  •  whole domain 20 s (TASK_DEADLINE_SECONDS) → &quot;Processing deadline exceeded&quot;</text><text x="40" y="579.5" font-size="14" fill="#1e1e1e" text-anchor="start">Worker crash → task not acked → Redis redelivers it after VISIBILITY_TIMEOUT_SECONDS (300 s) to another worker</text></svg>