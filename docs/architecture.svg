<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1745 760" width="1745" height="760" font-family="Virgil, 'Segoe Print', 'Comic Sans MS', cursive"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="hef08c00" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#f08c00" stroke-width="2"/></marker><marker id="he495057" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#495057" stroke-width="2"/></marker><marker id="hs495057" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#495057" stroke-width="2"/></marker><marker id="he6741d9" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#6741d9" stroke-width="2"/></marker><marker id="hs6741d9" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#6741d9" stroke-width="2"/></marker><marker id="he2f9e44" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#2f9e44" stroke-width="2"/></marker><marker id="hs2f9e44" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#2f9e44" stroke-width="2"/></marker><marker id="hee03131" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#e03131" stroke-width="2"/></marker><marker id="hse03131" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#e03131" stroke-width="2"/></marker><marker id="he1971c2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L12,6 L0,12" fill="none" stroke="#1971c2" stroke-width="2"/></marker><marker id="hs1971c2" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12,0 L0,6 L12,12" fill="none" stroke="#1971c2" stroke-width="2"/></marker></defs><text x="872.5" y="44.0" font-size="26" fill="#1e1e1e" text-anchor="middle" font-weight="bold">Domain Processing Service – Architecture</text><rect x="30" y="300" width="170" height="110" rx="14" fill="#f1f3f5" stroke="#495057" stroke-width="2"/><text x="115.0" y="328.0" font-size="18" fill="#495057" text-anchor="middle" font-weight="bold">Client</text><text x="115.0" y="354.0" font-size="14" fill="#343a40" text-anchor="middle">curl / Swagger UI</text><text x="115.0" y="371.5" font-size="14" fill="#343a40" text-anchor="middle">/docs  /redoc</text><rect x="545" y="140" width="260" height="430" rx="14" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" stroke-dasharray="8 6"/><text x="675" y="168.0" font-size="18" fill="#1971c2" text-anchor="middle" font-weight="bold">FastAPI API</text><rect x="570" y="190" width="210" height="150" rx="14" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><text x="675" y="218.0" font-size="18" fill="#1971c2" text-anchor="middle" font-weight="bold">api1 :18000</text><text x="675" y="244.0" font-size="14" fill="#343a40" text-anchor="middle">validate + dedupe</text><text x="675" y="261.5" font-size="14" fill="#343a40" text-anchor="middle">save job</text><text x="675" y="279.0" font-size="14" fill="#343a40" text-anchor="middle">enqueue tasks</text><text x="675" y="296.5" font-size="14" fill="#343a40" text-anchor="middle">return 202 job_id</text><rect x="570" y="380" width="210" height="135" rx="14" fill="#ffffff" stroke="#1971c2" stroke-width="2"/><text x="675" y="408.0" font-size="18" fill="#1971c2" text-anchor="middle" font-weight="bold">api2 :18001</text><text x="675" y="434.0" font-size="14" fill="#343a40" text-anchor="middle">GET /jobs/{id}</text><text x="675" y="451.5" font-size="14" fill="#343a40" text-anchor="middle">reads results</text><text x="675" y="469.0" font-size="14" fill="#343a40" text-anchor="middle">/healthz  /readyz</text><text x="675" y="540.0" font-size="13" fill="#1971c2" text-anchor="middle">stateless – any instance</text><text x="675" y="556.2" font-size="13" fill="#1971c2" text-anchor="middle">serves any job</text><rect x="905" y="140" width="300" height="430" rx="14" fill="#fff5f5" stroke="#e03131" stroke-width="2" stroke-dasharray="8 6"/><text x="1055" y="168.0" font-size="18" fill="#e03131" text-anchor="middle" font-weight="bold">Redis (AOF persistence)</text><rect x="930" y="190" width="250" height="140" rx="14" fill="#ffffff" stroke="#e03131" stroke-width="2"/><text x="1055" y="218.0" font-size="18" fill="#e03131" text-anchor="middle" font-weight="bold">Task queue</text><text x="1055" y="244.0" font-size="14" fill="#343a40" text-anchor="middle">Celery broker</text><text x="1055" y="261.5" font-size="14" fill="#343a40" text-anchor="middle">1 message per domain</text><text x="1055" y="279.0" font-size="14" fill="#343a40" text-anchor="middle">acks_late → redelivery</text><rect x="930" y="370" width="250" height="170" rx="14" fill="#ffffff" stroke="#e03131" stroke-width="2"/><text x="1055" y="398.0" font-size="18" fill="#e03131" text-anchor="middle" font-weight="bold">Job store</text><text x="1055" y="424.0" font-size="14" fill="#343a40" text-anchor="middle">job:{id}  created_at, domains</text><text x="1055" y="441.5" font-size="14" fill="#343a40" text-anchor="middle">job:{id}:results</text><text x="1055" y="459.0" font-size="14" fill="#343a40" text-anchor="middle">  domain → result JSON</text><text x="1055" y="476.5" font-size="14" fill="#343a40" text-anchor="middle">TTL 2 hours</text><rect x="1305" y="140" width="230" height="430" rx="14" fill="#ebfbee" stroke="#2f9e44" stroke-width="2" stroke-dasharray="8 6"/><text x="1420" y="168.0" font-size="18" fill="#2f9e44" text-anchor="middle" font-weight="bold">Celery workers</text><rect x="1325" y="190" width="190" height="100" rx="14" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><text x="1420" y="218.0" font-size="18" fill="#2f9e44" text-anchor="middle" font-weight="bold">worker-1</text><text x="1420" y="244.0" font-size="14" fill="#343a40" text-anchor="middle">threads ×</text><text x="1420" y="261.5" font-size="14" fill="#343a40" text-anchor="middle">WORKER_CONCURRENCY</text><rect x="1325" y="310" width="190" height="100" rx="14" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><text x="1420" y="338.0" font-size="18" fill="#2f9e44" text-anchor="middle" font-weight="bold">worker-2</text><text x="1420" y="364.0" font-size="14" fill="#343a40" text-anchor="middle">threads ×</text><text x="1420" y="381.5" font-size="14" fill="#343a40" text-anchor="middle">WORKER_CONCURRENCY</text><rect x="1325" y="430" width="190" height="100" rx="14" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/><text x="1420" y="458.0" font-size="18" fill="#2f9e44" text-anchor="middle" font-weight="bold">worker-3</text><text x="1420" y="484.0" font-size="14" fill="#343a40" text-anchor="middle">threads ×</text><text x="1420" y="501.5" font-size="14" fill="#343a40" text-anchor="middle">WORKER_CONCURRENCY</text><text x="1420" y="552.0" font-size="14" fill="#2f9e44" text-anchor="middle" font-weight="bold">× WORKER_REPLICAS</text><rect x="1585" y="230" width="140" height="250" rx="14" fill="#f3f0ff" stroke="#6741d9" stroke-width="2"/><text x="1655" y="258.0" font-size="18" fill="#6741d9" text-anchor="middle" font-weight="bold">Internet</text><text x="1655" y="284.0" font-size="14" fill="#343a40" text-anchor="middle">DNS servers</text><text x="1655" y="301.5" font-size="14" fill="#343a40" text-anchor="middle">A AAAA TXT</text><text x="1655" y="319.0" font-size="14" fill="#343a40" text-anchor="middle">CNAME MX NS</text><text x="1655" y="336.5" font-size="14" fill="#343a40" text-anchor="middle"></text><text x="1655" y="354.0" font-size="14" fill="#343a40" text-anchor="middle">Websites</text><text x="1655" y="371.5" font-size="14" fill="#343a40" text-anchor="middle">HTTPS → HTTP</text><line x1="450" y1="330" x2="568" y2="270" stroke="#495057" stroke-width="2" marker-end="url(#he495057)"/><text x="497" y="262.0" font-size="13" fill="#495057" text-anchor="middle">① POST /jobs</text><line x1="568" y1="450" x2="452" y2="380" stroke="#495057" stroke-width="2" marker-end="url(#he495057)"/><text x="500" y="470.0" font-size="13" fill="#495057" text-anchor="middle">⑥ GET /jobs/{id}</text><line x1="782" y1="240" x2="928" y2="240" stroke="#1971c2" stroke-width="2" marker-end="url(#he1971c2)"/><text x="855" y="203.0" font-size="13" fill="#1971c2" text-anchor="middle">② save job +</text><text x="855" y="219.2" font-size="13" fill="#1971c2" text-anchor="middle">enqueue</text><line x1="928" y1="455" x2="782" y2="455" stroke="#1971c2" stroke-width="2" marker-end="url(#he1971c2)"/><text x="855" y="433.0" font-size="13" fill="#1971c2" text-anchor="middle">⑥ read results</text><line x1="1182" y1="260" x2="1323" y2="240" stroke="#e03131" stroke-width="2" marker-end="url(#hee03131)"/><text x="1253" y="213.0" font-size="13" fill="#e03131" text-anchor="middle">③ deliver task</text><line x1="1323" y1="470" x2="1182" y2="460" stroke="#2f9e44" stroke-width="2" marker-end="url(#he2f9e44)"/><text x="1253" y="483.0" font-size="13" fill="#2f9e44" text-anchor="middle">⑤ save result</text><text x="1253" y="499.2" font-size="13" fill="#2f9e44" text-anchor="middle">(per domain)</text><line x1="1517" y1="355" x2="1583" y2="355" stroke="#6741d9" stroke-width="2" marker-end="url(#he6741d9)" marker-start="url(#hs6741d9)"/><text x="1550" y="325.0" font-size="13" fill="#6741d9" text-anchor="middle">④ probe</text><text x="40" y="628.0" font-size="18" fill="#1e1e1e" text-anchor="start" font-weight="bold">Flow</text><text x="40" y="652.0" font-size="14" fill="#1e1e1e" text-anchor="start">① Client submits domains  ② API normalizes + de-duplicates, stores the job and enqueues one task per domain, returns 202 immediately</text><text x="40" y="669.5" font-size="14" fill="#1e1e1e" text-anchor="start">③ Any free worker thread takes a task (each task goes to exactly one worker)  ④ DNS lookups (in parallel) then HTTP probe, 20 s deadline</text><text x="40" y="687.0" font-size="14" fill="#1e1e1e" text-anchor="start">⑤ Result saved per domain as soon as it is done  ⑥ GET (any API instance) shows live progress: PENDING → IN_PROGRESS → COMPLETED / COMPLETED_WITH_ERRORS</text><rect x="260" y="270" width="190" height="170" rx="14" fill="#fff9db" stroke="#f08c00" stroke-width="2" stroke-dasharray="8 6"/><text x="355" y="298" font-size="18" fill="#f08c00" text-anchor="middle" font-weight="bold">Load balancer</text><text x="355" y="324" font-size="14" fill="#343a40" text-anchor="middle">Nginx / ALB / K8s</text><text x="355" y="341.5" font-size="14" fill="#343a40" text-anchor="middle">round-robin, /readyz</text><text x="355" y="374" font-size="13" fill="#e8590c" text-anchor="middle" font-weight="bold">PROD SETUP ONLY</text><text x="355" y="390" font-size="13" fill="#e8590c" text-anchor="middle">local: client calls</text><text x="355" y="406" font-size="13" fill="#e8590c" text-anchor="middle">each API port directly</text><line x1="202" y1="355" x2="258" y2="355" stroke="#495057" stroke-width="2" marker-end="url(#he495057)" marker-start="url(#hs495057)"/></svg>